<app-user-header></app-user-header>
<div class="container">
    <h2>User Booking History</h2>
    <div>
    </div>
    <table *ngIf="bookings.length > 0">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Booking ID</th>
          <th>Booking Date</th>
          <th>Receiver Name</th>
          <th>Delivered Address</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let booking of bookings">
          <td>{{ booking[0] }}</td>
          <td>{{ booking[1] }}</td>
          <td>{{ booking[2] }}</td>
          <td>{{ booking[3] }}</td>
          <td>{{ booking[4] }}</td>
          <td>{{ booking[5] }}</td>
          <td>{{ booking[6] }}</td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="bookings.length === 0">No bookings found for this user.</p>
  </div>
