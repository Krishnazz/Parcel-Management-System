<h1>Register</h1>
    <form [formGroup]="registerPage" (ngSubmit)="onSubmit()" style="background-color: #f0ece4;">
        <div class="container">
            
            <div class="left-section">
                <h4>Personal Details</h4>

                <label>Name</label>
                <input type="text" formControlName="name" required maxlength="50">


                <label>Email</label>
                <input type="text" formControlName="email" required>
                
                <label>Mobile Number</label>
                <div class="mobile-container">
                    <select id="country-id">
                        <option value="+91">+91(IN)</option>
                        <option value="+1">+1(USA)</option>
                        <option value="+44">+44(UK)</option>
                    </select>
                    <input type="text" formControlName="mobile" required maxlength="10">
                </div>
                

                <label>Address</label>
                <input formControlName="address" required>
            </div>

            <div class="right-section">
                <h4>Username and Password</h4>

                <label>User ID</label>
                <input type="string" id="userid" formControlName="userid">
                <label>Password</label>
                <input type="password" formControlName="password" required maxlength="30">
                

                <label>Confirm Password</label>
                <input type="password" formControlName="confirmPassword" required maxlength="30">
                

                <div class="buttons">
                    <button type="reset" class="reset-btn">Reset</button>
                    <button type="submit">Register</button>
                </div>
            </div>
        </div>
    </form>

    <div class="container" id="acknowledgment" style="display: none; text-align: center;">
        <h2 style="color: green;">Customer Registration Successful</h2>
        <p style="text-align: left; margin-left: 150px;"><strong>Username:</strong> <span id="ack-username"></span></p>
        <p style="text-align: left;  margin-left: 150px;"><strong>Name:</strong> <span id="ack-name"></span></p>
        <p style="text-align: left;  margin-left: 150px;"><strong>Email:</strong> <span id="ack-email"></span></p>
        <button onclick="goToLogin()">Go to Login</button>
    </div>
