<app-admin-header></app-admin-header>
<div class="container">
    <h2 style="text-align: center;">Booking History</h2>

    <div class="search-bar">
      <input type="text" [(ngModel)]="customerId" placeholder="Enter Customer ID" />
      <input type="date" [(ngModel)]="startDate" placeholder="Start Date" />
      <input type="date" [(ngModel)]="endDate" placeholder="End Date" />
      <button (click)="fetchBookingHistory()">Fetch History</button>
    </div>

    <table *ngIf="bookings.length > 0">
      <thead>
        <tr>
          <th>Customer ID</th>
          <th>Booking ID</th>
          <th>Booking Date</th>
          <th>Receiver Name</th>
          <th>Delivered Address</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let booking of bookings">
          <td>{{ booking[0] }}</td>
          <td>{{ booking[1] }}</td>
          <td>{{ booking[2] }}</td>
          <td>{{ booking[3] }}</td>
          <td>{{ booking[4] }}</td>
          <td>{{ booking[5] }}</td>
          <td>{{ booking[6] }}</td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="bookings.length === 0">No bookings found for this customer.</p>
</div>
